name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Run the built CLI on a snapshot with no problems
        run: node dist/cli.js check test/fixtures/docs-server.json
      - name: Run the built CLI on a server over stdio, which has a tool with no description
        run: |
          set +e
          node dist/cli.js check -- node test/fixtures/servers/fake-server.mjs test/fixtures/servers/docs.json
          test $? -eq 1
      - name: Run the built CLI on a server over Streamable HTTP, which has a tool with no description
        run: |
          node test/fixtures/servers/fake-http-server.mjs test/fixtures/servers/docs.json 0 > url.txt &
          for _ in $(seq 50); do [ -s url.txt ] && break; sleep 0.1; done
          set +e
          node dist/cli.js check "$(cat url.txt)"
          test $? -eq 1
      - name: Run the built CLI on the README's example, which has 5 problems
        run: |
          set +e
          node dist/cli.js check examples/poisoned-server.json > example.txt
          test $? -eq 1 && grep -q "5 problems (4 errors, 1 warning) in 3 tools" example.txt

  node22:
    # engines says >=22.13 (Node 20 is end-of-life, and pnpm 11 needs 22.13): the tests run on the
    # oldest Node it allows, too.
    name: Tests on Node 22
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
